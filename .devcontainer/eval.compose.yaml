name: hicode-evaluation
services:
  eval:
    image: ${HICODE_EVAL_IMAGE:-hicode-ubuntu:eval}
    build:
      context: .
      dockerfile: eval.Dockerfile
      args:
        HTTP_PROXY: "${HICODE_CONTAINER_PROXY:-}"
        HTTPS_PROXY: "${HICODE_CONTAINER_PROXY:-}"
    container_name: hicode-eval-linux
    labels:
      dev.hicode.role: eval
    init: true
    user: root
    command: ["sleep", "infinity"]
    working_dir: /eval
    security_opt:
      - seccomp=unconfined
      - apparmor=hicode-development
      - systempaths=unconfined
    environment:
      HTTP_PROXY: "${HICODE_CONTAINER_PROXY:-}"
      HTTPS_PROXY: "${HICODE_CONTAINER_PROXY:-}"
      http_proxy: "${HICODE_CONTAINER_PROXY:-}"
      https_proxy: "${HICODE_CONTAINER_PROXY:-}"
      NO_PROXY: localhost,127.0.0.1,::1
    volumes:
      - evaluation:/eval
volumes:
  evaluation:
